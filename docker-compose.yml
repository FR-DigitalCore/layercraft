# Dans le réseau Compose, les services se joignent par leur NOM et sur leur
# port INTERNE. Les variables *_HOST_PORT plus bas ne concernent que la
# machine hôte : les changer ne doit jamais toucher ces adresses-là, sous
# peine d'un ECONNREFUSED côté conteneur.
x-url-base: &url-base
  DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-impression3d}

# Figées dans le bundle client au build. `app` et `migrate` partagent la même
# liste : des valeurs différentes feraient reconstruire l'étape `builder`
# deux fois, l'image des migrations en dérivant aussi.
x-args-build: &args-build
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}

services:
  app:
    build:
      context: .
      args: *args-build
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *url-base
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # Le navigateur, lui, ne sait pas résoudre `minio` : les presigned URLs
      # sont signées sur l'hôte public. En local, la boucle locale du poste
      # sur le port publié ci-dessous.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-${MINIO_HOST_PORT:-9000}}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
    ports:
      # Boucle locale seulement : sert au débogage et aux tunnels SSH. Un
      # reverse proxy conteneurisé ne passe pas par là, il vise app:3000 par
      # le réseau (voir deploy/docker-compose.proxy.yml).
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Migrations : `docker compose run --rm migrate`
  # Étape d'image dédiée, qui garde node_modules en entier : le CLI Prisma a
  # besoin de ses dépendances transitives. La commande est son CMD.
  migrate:
    build:
      context: .
      target: migrator
      args: *args-build
    env_file: .env
    environment: *url-base
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["outils"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impression3d}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Jamais exposé publiquement : accès par tunnel SSH si besoin.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-impression3d}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - miniodata:/data
    ports:
      # L'API : publiée en local, exposée au navigateur par le reverse proxy.
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      # La console d'administration reste strictement locale.
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  miniodata:

networks:
  # Nommé pour qu'un proxy vivant dans un autre compose puisse s'y rattacher.
  default:
    name: layercraft
