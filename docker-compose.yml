services:
  app:
    build:
      context: .
      args:
        # Figée dans le bundle client au build : doit valoir le domaine public.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau Compose, les services se joignent par leur NOM et sur
      # leur port INTERNE (5432, 9000). Les ports *_HOST_PORT plus bas ne
      # concernent que la machine hôte : les changer ne doit jamais modifier
      # ces trois lignes, sous peine d'un ECONNREFUSED côté conteneur.
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-impression3d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # Le navigateur, lui, ne sait pas résoudre `minio` : les presigned URLs
      # sont signées sur l'hôte public. En local c'est la boucle locale du
      # poste, sur le port publié par le service minio.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-${MINIO_HOST_PORT:-9000}}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
    ports:
      # Seul Nginx doit joindre l'app : on n'écoute que sur la boucle locale.
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Migrations : `docker compose run --rm migrate`
  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-impression3d}
    # Invoqué par son chemin réel plutôt que par node_modules/.bin : le CLI
    # charge ses ressources .wasm depuis le dossier du fichier exécuté.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["outils"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impression3d}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Jamais exposé publiquement : accès par tunnel SSH si besoin.
      # POSTGRES_HOST_PORT ne change que le port côté hôte (utile si un
      # Postgres tourne déjà en 5432) ; l'app continue de viser 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-impression3d}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # Redirige la console vers le domaine public s'il est configuré.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - miniodata:/data
    ports:
      # L'API (9000 à l'intérieur) est publiée sur la boucle locale et exposée
      # au navigateur par Nginx : les presigned URLs sont signées sur l'hôte
      # public. MINIO_HOST_PORT ne change que le port côté hôte.
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      # La console d'administration reste strictement locale.
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  miniodata:
