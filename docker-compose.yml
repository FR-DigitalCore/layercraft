services:
  app:
    container_name: layercraft-app
    build:
      context: .
      args:
        # Figées dans le bundle client au build.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # Noms de service et ports INTERNES. Les *_HOST_PORT plus bas ne
      # concernent que la machine hôte et ne changent jamais ces lignes.
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-impression3d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # Le navigateur, lui, ne résout pas `minio` : les liens signés le sont
      # sur l'hôte public.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-${MINIO_HOST_PORT:-9000}}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    networks: [default, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        # service_started et non service_healthy : le miroir n'embarque pas
        # forcément `mc`, et l'app crée ses buckets au premier upload.
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Migrations : `docker compose run --rm migrate`
  # Image à part qui garde node_modules en entier, le CLI Prisma ayant besoin
  # de ses dépendances transitives. La commande est son CMD (voir Dockerfile).
  migrate:
    build:
      context: .
      target: migrator
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-impression3d}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["outils"]

  postgres:
    container_name: layercraft-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impression3d}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Jamais exposé publiquement : accès par tunnel SSH si besoin.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-impression3d}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    container_name: layercraft-minio
    # MinIO a retiré ses images de Docker Hub (septembre 2026) : `minio/minio`
    # renvoie 404, et quay.io répond 401 aux pulls anonymes depuis fin
    # septembre. pgsty republie le binaire officiel avec le même entrypoint
    # et le même /data.
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      # Console d'administration : strictement locale.
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [default, proxy]

volumes:
  pgdata:
  miniodata:

networks:
  default:
    name: layercraft
  # Réseau du reverse proxy, créé par lui. Mettre ici le nom que donne
  # `docker network ls` (souvent npm_default).
  # Sans reverse proxy : docker network create proxy
  proxy:
    external: true
    name: proxy
