# Surcharge pour un reverse proxy déjà en place sur son propre réseau
# (Nginx Proxy Manager, Traefik, Caddy…), comme vos autres services.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.proxy.yml up -d
#
# Pour éviter de répéter les deux fichiers à chaque commande :
#   export COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.proxy.yml
# ou, dans un fichier .env à la racine :
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.proxy.yml
#
# Le nom du réseau existant se règle par RESEAU_PROXY (défaut : « proxy ») :
#   docker network ls   # pour retrouver le nom exact
#
# Seuls `app` et `minio` rejoignent le réseau partagé. Postgres reste sur le
# réseau interne : rien de ce qui est branché au proxy n'a à le joindre.

services:
  app:
    networks:
      default: {}
      proxy:
        # Alias explicite : sur un réseau partagé entre plusieurs piles, un
        # nom aussi courant que « app » entrerait en collision avec le
        # service d'une autre pile et la résolution deviendrait ambiguë.
        aliases:
          - layercraft-app

  minio:
    networks:
      default: {}
      proxy:
        aliases:
          - layercraft-minio

networks:
  proxy:
    external: true
    name: ${RESEAU_PROXY:-proxy}
